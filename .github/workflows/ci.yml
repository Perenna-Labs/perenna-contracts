name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: Check, Test & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - # Third-party GitHub Actions are pinned to commit SHAs for security hardening
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b
    - name: Cache cargo registry & build
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          target

          '
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: '${{ runner.os }}-cargo-

          '
    - name: Cargo check
      run: cargo check --all-targets
    - name: Cargo test
      run: cargo test
    - name: Cargo clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Cargo fmt check
      run: cargo fmt --all -- --check
  wasm:
    name: Build Release Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b
    - name: Install Stellar CLI
      run: |
        curl --fail --location --retry 5 --retry-all-errors \
          --output /tmp/stellar-cli.tar.gz \
          https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz
        tar xzf /tmp/stellar-cli.tar.gz -C /tmp
        sudo install -m 0755 /tmp/stellar /usr/local/bin/stellar
        stellar --version
    - name: Build release wasm
      run: stellar contract build
    - name: Upload wasm artifact
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: stellar-stream-wasm
        path: target/wasm32v1-none/release/stellar_stream.wasm
        if-no-files-found: error
